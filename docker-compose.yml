version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cycle_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cycle_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cycle_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

